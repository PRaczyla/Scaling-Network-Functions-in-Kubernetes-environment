        {"apiVersion":"v1","kind":"Pod","metadata":{"annotations":{},"name":"nat-setup-hostnet","namespace":"default"},"spec":{"containers":[{"command":["/bin/bash","-c","set -e\n\nsysctl -w net.ipv4.ip_forward=1\n\niptables -t nat -D POSTROUTING -s 10.45.0.0/16 -o eth0 -j MASQUERADE 2\u003e/dev/null || true\niptables -D FORWARD -s 10.45.0.0/16 -j ACCEPT 2\u003e/dev/null || true\niptables -D FORWARD -d 10.45.0.0/16 -j ACCEPT 2\u003e/dev/null || true\n\niptables -t nat -A POSTROUTING -s 10.45.0.0/16 -o eth0 -j MASQUERADE\niptables -A FORWARD -s 10.45.0.0/16 -j ACCEPT\niptables -A FORWARD -d 10.45.0.0/16 -j ACCEPT\n\necho \"NAT configured on node rpislave2\"\necho \"UE subnet: 10.45.0.0/16\"\necho \"Outgoing interface: eth0\"\n\nsleep infinity\n"],"image":"nicolaka/netshoot","name":"nat","securityContext":{"privileged":true}}],"hostNetwork":true,"nodeName":"rpislave2","restartPolicy":"Always"}}
    creationTimestamp: "2026-07-05T18:19:03Z"
