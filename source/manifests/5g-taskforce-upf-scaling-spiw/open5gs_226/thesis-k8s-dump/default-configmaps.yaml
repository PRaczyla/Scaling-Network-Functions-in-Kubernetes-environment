          server:
          - dev: eth0
        metrics:
          server:
          - dev: eth0
            port: 9090
        guami:
          -
            amf_id:
              region: 2
              set: 1
            plmn_id:
              mcc: "999"
              mnc: "70"
        tai:
          -
            plmn_id:
              mcc: "999"
              mnc: "70"
            tac:
            - 1
