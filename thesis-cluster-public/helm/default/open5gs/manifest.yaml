    app.kubernetes.io/instance: open5gs
    app.kubernetes.io/managed-by: Helm
data:
  add_admin.sh: |-
    #!/bin/bash
    
    set -e
    
    echo "add admin user with password 1423 if no users"
    
    cat << EOF > /tmp/account.js
    db = db.getSiblingDB('open5gs')
    cursor = db.accounts.find()
    if ( cursor.count() == 0 ) {
        db.accounts.insert({ salt: 'f5c15fa72622d62b6b790aa8569b9339729801ab8bda5d13997b5db6bfc1d997', hash: '', username: 'admin', roles: [ 'admin' ], "__v" : 0})
    }
    EOF
    
    mongo $DB_URI /tmp/account.js
    rm -f /tmp/account.js
